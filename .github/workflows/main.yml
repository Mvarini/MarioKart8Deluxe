name: Deploy Laravel to VPS MarioKart8

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Acessando VPS e rodando comandos
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/mariokart.marcielvarini.com.br

            #Force o reset antes do pull no script
            git fetch --all
            git reset --hard origin/main

            # Instala dependências
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Roda migrações e limpa caches
            php artisan migrate --force

            # Limpa TUDO e reotimiza
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan optimize
            
            # Reinicia o PHP-FPM (Opcional, mas resolve 90% dos casos de cache persistente)
            # sudo systemctl restart php8.x-fpm
